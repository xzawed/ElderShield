{% extends "admin/base.html" %}
{% block title %}Login · ElderShield Admin{% endblock %}
{% block content %}
<section class="card">
  <h1>Admin login</h1>
  <p class="muted">Enter the admin API key (same as <code>ADMIN_API_KEY</code>).</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/ui/login">
    <label for="api_key">Admin API key</label>
    <input id="api_key" name="api_key" type="password" required autocomplete="current-password">
    <p style="margin-top:1rem"><button type="submit">Sign in</button></p>
  </form>
</section>
{% endblock %}
