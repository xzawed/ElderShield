# ElderShield backend on Railway.
# Live service uses rootDirectory=/backend + Railpack; startCommand must expand PORT via shell.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "admin-web/**", "Dockerfile", "railway.toml"]

[deploy]
startCommand = "sh -c \"uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}\""
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
